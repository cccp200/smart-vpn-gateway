services:
  # WireGuard VPN - Albanien
  wireguard-albanien:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard-albanien
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
    volumes:
      - ./config/albanien:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51821:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  # WireGuard VPN - Danmark
  wireguard-danmark:
